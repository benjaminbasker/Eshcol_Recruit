; PHP settings for the app, picked up automatically by cPanel's PHP.
; They save changing anything in cPanel > Select PHP Version > Options.
upload_max_filesize = 12M
post_max_size = 16M
max_file_uploads = 50
max_execution_time = 120
memory_limit = 256M
display_errors = Off
log_errors = On
session.cookie_httponly = 1
session.use_strict_mode = 1
expose_php = Off
